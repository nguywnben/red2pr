[project]
name = "red2pr-workspace"
version = "0.1.0"
description = "Red2PR — Self-hosted autonomous CI/CD repair with deterministic proof"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "py-contracts",
    "red2pr-control",
    "red2pr-worker",
    "red2pr-cli",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "httpx2>=0.1.0",
    "hypothesis>=6.115.0,<7.0.0",
    "import-linter>=2.1,<3.0",
    "mypy>=1.13.0,<2.0.0",
    "pgserver>=0.1.4,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "types-PyYAML>=6.0.12.20240917",
]

[tool.uv.sources]
py-contracts = { workspace = true }
red2pr-control = { workspace = true }
red2pr-worker = { workspace = true }
red2pr-cli = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/py-contracts",
    "apps/control-plane",
    "apps/worker-supervisor",
    "apps/cli",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/py-contracts/src",
    "apps/control-plane/src",
    "apps/worker-supervisor/src",
    "apps/cli/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/py-contracts/src",
    "apps/control-plane/src",
    "apps/worker-supervisor/src",
    "apps/cli/src",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = [
    "packages/py-contracts/tests",
    "apps/control-plane/tests",
    "apps/worker-supervisor/tests",
    "apps/cli/tests",
]

[tool.importlinter]
root_packages = [
    "py_contracts",
    "red2pr_control",
    "red2pr_worker",
    "red2pr_cli",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Canonical contracts remain pure and independent of runtime apps"
id = "contracts-remain-pure"
type = "forbidden"
source_modules = ["py_contracts"]
forbidden_modules = ["red2pr_control", "red2pr_worker", "red2pr_cli"]

[[tool.importlinter.contracts]]
name = "Isolated Z3 worker supervisor never imports control-plane or ORM internals"
id = "worker-zero-control-imports"
type = "forbidden"
source_modules = ["red2pr_worker"]
forbidden_modules = ["red2pr_control", "red2pr_cli", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Z1 orchestrator, verifier, db and audit never directly import Z2 raw secret, publisher or inference brokers"
id = "control-plane-z1-z2-boundaries"
type = "forbidden"
source_modules = [
    "red2pr_control.orchestrator",
    "red2pr_control.verification",
    "red2pr_control.db",
    "red2pr_control.analytics_audit",
]
forbidden_modules = [
    "red2pr_control.secrets",
    "red2pr_control.publisher",
    "red2pr_control.inference",
]

[[tool.importlinter.contracts]]
name = "Operator CLI never directly imports Z2 secret broker or Z3 worker runtime"
id = "cli-no-secret-or-worker-internals"
type = "forbidden"
source_modules = ["red2pr_cli"]
forbidden_modules = ["red2pr_worker", "red2pr_control.secrets"]
