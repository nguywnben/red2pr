name: Release & Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to publish (e.g. v0.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build Packages & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$RAW_TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          CONTROL_IMAGE="ghcr.io/${OWNER_LC}/red2pr-control"
          WORKER_IMAGE="ghcr.io/${OWNER_LC}/red2pr-worker"
          CONTROL_TAGS="${CONTROL_IMAGE}:${VERSION},${CONTROL_IMAGE}:${RAW_TAG}"
          WORKER_TAGS="${WORKER_IMAGE}:${VERSION},${WORKER_IMAGE}:${RAW_TAG}"
          if [[ "$RAW_TAG" == *-beta* ]]; then
            CONTROL_TAGS="${CONTROL_TAGS},${CONTROL_IMAGE}:beta"
            WORKER_TAGS="${WORKER_TAGS},${WORKER_IMAGE}:beta"
          fi
          {
            echo "tag=${RAW_TAG}"
            echo "version=${VERSION}"
            echo "owner_lc=${OWNER_LC}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "control_image=${CONTROL_IMAGE}"
            echo "worker_image=${WORKER_IMAGE}"
            echo "control_tags=${CONTROL_TAGS}"
            echo "worker_tags=${WORKER_TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22 & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend SPA & TypeScript client artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@9.15.9
          pnpm install --frozen-lockfile
          pnpm run quickstart:web
          mkdir -p dist-artifacts
          pnpm --filter @red2pr/ts-client pack --pack-destination "$(pwd)/dist-artifacts"
          tar -czf "dist-artifacts/red2pr-web-dist-${{ steps.meta.outputs.tag }}.tar.gz" -C apps/web/dist .
          tar -czf "dist-artifacts/red2pr-contracts-${{ steps.meta.outputs.tag }}.tar.gz" \
            contracts/openapi \
            contracts/schemas \
            deploy/compose \
            deploy/install/release-manifest.schema.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python wheels and source distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build "hatchling>=1.25.0"
          for pkg_dir in packages/py-contracts apps/control-plane apps/worker-supervisor apps/cli; do
            python -m build --no-isolation --outdir dist-artifacts "$pkg_dir"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build hardened control-plane container for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/control-plane.Dockerfile
          load: true
          tags: local/red2pr-control:smoke
          cache-from: type=gha,scope=control
          cache-to: type=gha,scope=control,mode=max

      - name: Build hardened worker-supervisor container for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/worker-supervisor.Dockerfile
          load: true
          tags: local/red2pr-worker:smoke
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Verify non-root read-only container wiring
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ISSUER="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          SMOKE_DB_PW="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          docker run --rm \
            --user 10001:10001 \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e RED2PR_DATABASE_URL="postgresql+psycopg://red2pr:${SMOKE_DB_PW}@127.0.0.1:5432/red2pr" \
            -e RED2PR_BOOTSTRAP_ISSUER_SECRET="${SMOKE_ISSUER}" \
            local/red2pr-control:smoke --check-wiring
          docker run --rm \
            --user 10001:10001 \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            local/red2pr-worker:smoke --check-wiring

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push red2pr-control package to GHCR
        id: push_control
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/control-plane.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.control_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=control

      - name: Push red2pr-worker package to GHCR
        id: push_worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/worker-supervisor.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.worker_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=worker

      - name: Generate container digest manifest & SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cat > dist-artifacts/container-images.txt <<EOF
          ${{ steps.meta.outputs.control_image }}:${{ steps.meta.outputs.version }}@${{ steps.push_control.outputs.digest }}
          ${{ steps.meta.outputs.worker_image }}:${{ steps.meta.outputs.version }}@${{ steps.push_worker.outputs.digest }}
          EOF
          sed -i 's/^[[:space:]]*//' dist-artifacts/container-images.txt
          (
            cd dist-artifacts
            rm -f SHA256SUMS.txt
            sha256sum * | sort -k2 > SHA256SUMS.txt
          )
          cat dist-artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [[ "${{ steps.meta.outputs.is_prerelease }}" == "true" ]]; then
            TITLE="Red2PR ${TAG} — Early-Access Beta (CI Repair with Deterministic Proof)"
            PRERELEASE_ARGS=(--prerelease)
          else
            TITLE="Red2PR ${TAG}"
            PRERELEASE_ARGS=()
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-artifacts/* --clobber
            if [[ -f "$NOTES_FILE" ]]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" "${PRERELEASE_ARGS[@]}"
            fi
          else
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "$TAG" dist-artifacts/* --title "$TITLE" --notes-file "$NOTES_FILE" "${PRERELEASE_ARGS[@]}"
            else
              gh release create "$TAG" dist-artifacts/* --title "$TITLE" --generate-notes "${PRERELEASE_ARGS[@]}"
            fi
          fi
