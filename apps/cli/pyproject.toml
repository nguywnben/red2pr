[project]
name = "red2pr-cli"
version = "0.1.0"
description = "Red2PR cross-platform operator CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "py-contracts",
]

[project.scripts]
red2pr = "red2pr_cli.main:main"

[tool.uv.sources]
py-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red2pr_cli"]
