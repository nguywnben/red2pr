[project]
name = "red2pr-worker"
version = "0.1.0"
description = "Red2PR standalone isolated worker supervisor (Z2/Z3 — zero control-plane imports)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "py-contracts",
]

[tool.uv.sources]
py-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red2pr_worker"]
