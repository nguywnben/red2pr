[project]
name = "red2pr-control"
version = "0.1.0"
description = "Red2PR Python/FastAPI modular monolith control plane (Z1/Z2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "py-contracts",
    "pydantic>=2.10.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
]

[tool.uv.sources]
py-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red2pr_control"]
